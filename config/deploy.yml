# Perplefina - AI-powered Financial Search Engine
service: perplefina

# Docker image name (will be built and pushed to registry)
image: kutty/perplefina

# Deploy to these servers
# Replace with your server IP or domain
servers:
  web:
    - your-server-ip-or-domain.com
    # Add more servers for load balancing:
    # - server2.example.com

# SSL and domain configuration
proxy:
  ssl: true
  host: perplefina.your-domain.com  # Change to your domain
  # Perplefina runs on port 3000
  app_port: 3000

# Docker registry configuration
# Option 1: Use Docker Hub (default)
registry:
  # server: docker.io  # Default, no need to specify
  username: kutty  # Your Docker Hub username
  password:
    - KAMAL_REGISTRY_PASSWORD

# Option 2: Use GitHub Container Registry
# registry:
#   server: ghcr.io
#   username: Kuttykishorekk
#   password:
#     - KAMAL_REGISTRY_PASSWORD

# Builder configuration
builder:
  arch: amd64
  dockerfile: app.dockerfile
  context: .

# Environment variables
env:
  clear:
    # SearxNG URL (internal network - Kamal handles networking)
    SEARXNG_API_URL: http://searxng:8080
    DATA_DIR: /home/perplexica
    NODE_ENV: production
    PORT: 3000
  secret:
    # Add your AI API keys here (will be read from .kamal/secrets)
    # - OPENAI_API_KEY
    # - ANTHROPIC_API_KEY
    # - GROQ_API_KEY
    # - GEMINI_API_KEY
    # - DEEPSEEK_API_KEY

# Persistent volumes for data
volumes:
  - "perplefina_data:/home/perplexica/data"
  - "perplefina_uploads:/home/perplexica/uploads"

# SearxNG as an accessory service
# Kamal will create a network so services can communicate
accessories:
  searxng:
    image: searxng/searxng:latest
    host: your-server-ip-or-domain.com  # Same server as main app
    port: 4000
    # Internal port for SearxNG
    options: --publish "4000:8080"
    env:
      clear:
        # SearxNG will be accessible at http://searxng:8080 from Perplefina container
        SEARXNG_HOSTNAME: searxng.your-domain.com  # Optional: separate domain
    files:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng/finance-engines.yml:/etc/searxng/finance-engines.yml:ro
    directories:
      - searxng_data:/etc/searxng

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal app logs -r job" will tail logs from the first server in the job section.
#
# aliases:
#   shell: app exec --interactive --reuse "bash"

# Use a different ssh user than root
#
# ssh:
#   user: app

# Use a persistent storage volume.
#
# volumes:
#   - "app_storage:/app/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
#
# asset_path: /app/public/assets

# Configure rolling deploys by setting a wait time between batches of restarts.
#
# boot:
#   limit: 10 # Can also specify as a percentage of total hosts, such as "25%"
#   wait: 2

